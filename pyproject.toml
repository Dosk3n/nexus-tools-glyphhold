[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-tools-glyphhold"
version = "2.1.0"
description = "Nexus tool pack for connecting agents to Glyph Hold memory and secrets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "nexus-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_tools_glyphhold*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
